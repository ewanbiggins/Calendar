name: Update prices
on:
  schedule:
    - cron: '30 17 * * 1-5'
    - cron: '15 7 * * 2-6'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices
        env:
          SYMBOLS: 'VUAG.L,VUSA.L,CSPX.L,GB00B4PQW151'
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import re
          import sys
          import time
          import urllib.parse
          import urllib.request
          
          UA = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
              "Accept": "application/json",
          }
          
          
          def get(url):
              last = None
              for i in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=25) as r:
                          return json.loads(r.read().decode("utf-8"))
                  except Exception as e:
                      last = e
                      time.sleep(2 + 3 * i)
              raise last
          
          
          def resolve(ident):
              # a fund's ISIN is turned into the symbol Yahoo uses for it; a ticker is used as it is
              if not re.fullmatch(r"[A-Z]{2}[A-Z0-9]{9}[0-9]", ident):
                  return ident
              for host in ("query2", "query1"):
                  try:
                      j = get("https://%s.finance.yahoo.com/v1/finance/search?q=%s&quotesCount=6&newsCount=0" % (host, ident))
                      for q in j.get("quotes", []):
                          if q.get("symbol"):
                              return q["symbol"]
                  except Exception:
                      pass
              return None
          
          
          def quote(sym):
              last = None
              for host in ("query1", "query2"):
                  try:
                      j = get("https://%s.finance.yahoo.com/v8/finance/chart/%s?range=10d&interval=1d" % (host, urllib.parse.quote(sym)))
                      res = j["chart"]["result"][0]
                      meta = res.get("meta", {})
                      stamps = res.get("timestamp") or []
                      closes = ((res.get("indicators") or {}).get("quote") or [{}])[0].get("close") or []
                      pts = [(t, c) for t, c in zip(stamps, closes) if c]
                      price = meta.get("regularMarketPrice") or (pts[-1][1] if pts else None)
                      when = meta.get("regularMarketTime") or (pts[-1][0] if pts else None)
                      if not price:
                          raise ValueError("no price")
                      cur = meta.get("currency") or ""
                      if cur == "GBp":
                          cur = "GBX"
                      day = datetime.datetime.fromtimestamp(when, datetime.timezone.utc).strftime("%Y-%m-%d") if when else ""
                      return {"price": round(float(price), 4), "currency": cur, "date": day, "symbol": sym, "name": meta.get("longName") or meta.get("shortName") or ""}
                  except Exception as e:
                      last = e
              raise last
          
          
          old = {}
          try:
              old = json.load(open("prices.json")).get("prices", {})
          except Exception:
              pass
          out, errors = {}, {}
          for ident in [s.strip().upper() for s in os.environ.get("SYMBOLS", "").split(",") if s.strip()]:
              try:
                  sym = resolve(ident)
                  if not sym:
                      raise ValueError("could not find " + ident)
                  out[ident] = quote(sym)
              except Exception as e:
                  errors[ident] = str(e)
                  if ident in old:
                      out[ident] = dict(old[ident], stale=True)
                  print("FAILED", ident, e, file=sys.stderr)
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          json.dump({"updated": stamp, "prices": out, "errors": errors}, open("prices.json", "w"), indent=1)
          print(json.dumps(out)[:600])
          PY
      - name: Save
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Update prices" && git push)
