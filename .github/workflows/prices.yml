name: Update prices
on:
  schedule:
    - cron: '30 17 * * 1-5'
    - cron: '15 7 * * 2-6'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices
        env:
          SYMBOLS: 'GB00BVPLDL62,IE00BFMXXD54'
        run: |
          python3 - <<'PY'
          import csv
          import datetime
          import io
          import json
          import os
          import re
          import sys
          import time
          import urllib.parse
          import urllib.request
          
          UA = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
              "Accept": "application/json,text/csv,text/html;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-GB,en;q=0.9",
          }
          ISIN = re.compile(r"^[A-Z]{2}[A-Z0-9]{9}[0-9]$")
          
          
          def fetch(url, tries=2):
              last = None
              for i in range(tries):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=25) as r:
                          return r.read().decode("utf-8", "replace")
                  except Exception as e:
                      last = e
                      if i + 1 < tries:
                          time.sleep(3 + 3 * i)
              raise last
          
          
          def get(url):
              return json.loads(fetch(url))
          
          
          def num(text):
              return round(float(str(text).replace(",", "").strip()), 4)
          
          
          # ---- source 1 for ETFs and shares: Stooq (plain CSV, friendly to scripts) ----
          def from_stooq(ident):
              if ISIN.match(ident):
                  raise ValueError("stooq has no funds")
              t = ident.lower()
              if t.endswith(".lon"):
                  t = t[:-4] + ".l"
              s = t[:-2] + ".uk" if t.endswith(".l") else (t if "." in t else t + ".us")
              rows = list(csv.reader(io.StringIO(fetch("https://stooq.com/q/l/?s=%s&f=sd2t2ohlcv&h&e=csv" % urllib.parse.quote(s)).strip())))
              if len(rows) < 2:
                  raise ValueError("empty answer")
              d = dict(zip(rows[0], rows[1]))
              close = d.get("Close", "")
              if not close or close.upper() == "N/D":
                  raise ValueError("no data for " + s)
              day = d.get("Date", "")
              # Stooq does not say which currency: the app uses the unit you chose for the holding
              return {"price": num(close), "currency": "", "date": day if re.fullmatch(r"\d{4}-\d\d-\d\d", day or "") else "", "symbol": s.upper(), "name": ident, "source": "Stooq"}
          
          
          # ---- source 1 for funds and ETFs given by ISIN: the Financial Times ----
          def ft_parse(html, ident, url):
              m = re.search(r"Price \(([A-Za-z]{3})\).{0,300}?([0-9][0-9,]*\.[0-9]+)", html, re.S)
              if not m:
                  raise ValueError("no price on the page")
              day = ""
              d = re.search(r"as of ([A-Za-z]{3,9}) (\d{1,2}) (\d{4})", html)
              if d:
                  for fmt in ("%b %d %Y", "%B %d %Y"):
                      try:
                          day = datetime.datetime.strptime("%s %s %s" % d.groups(), fmt).strftime("%Y-%m-%d")
                          break
                      except ValueError:
                          pass
              t = re.search(r"<title>(.*?)</title>", html, re.S)
              name = re.split(r",| - ", t.group(1).strip())[0].strip() if t else ""
              sym = re.search(r"[?&]s=([^&]+)", url)
              return {"price": num(m.group(2)), "currency": m.group(1).upper(), "date": day, "symbol": sym.group(1) if sym else ident, "name": name or ident, "source": "FT"}
          
          
          def from_ft(ident):
              if not ISIN.match(ident):
                  raise ValueError("ft lookup needs an ISIN")
              seen = []
              urls = ["https://markets.ft.com/data/%s/tearsheet/summary?s=%s:%s" % (kind, ident, cur) for kind in ("funds", "etfs") for cur in ("GBP", "USD", "EUR")]
              for u in urls:
                  try:
                      return ft_parse(fetch(u, tries=1), ident, u)
                  except Exception as e:
                      seen.append(str(e))
              # FT's own search: follow the first result for this ISIN
              try:
                  html = fetch("https://markets.ft.com/data/search?query=" + ident, tries=1)
                  for link in re.findall(r'href="(/data/(?:funds|etfs|equities)/tearsheet/summary\?s=[^"]+)"', html)[:3]:
                      u = "https://markets.ft.com" + link.replace("&amp;", "&")
                      try:
                          return ft_parse(fetch(u, tries=1), ident, u)
                      except Exception as e:
                          seen.append(str(e))
              except Exception as e:
                  seen.append("search: " + str(e))
              raise ValueError("no page worked (" + "; ".join(sorted(set(seen)))[:160] + ")")
          
          
          # ---- last resort: Yahoo (often refuses GitHub's servers with a 429) ----
          def yahoo_symbol(ident):
              if "=" in ident:
                  return ident.split("=", 1)[1].strip()
              if not ISIN.match(ident):
                  return ident
              for host in ("query2", "query1"):
                  try:
                      for q in get("https://%s.finance.yahoo.com/v1/finance/search?q=%s&quotesCount=10&newsCount=0" % (host, ident)).get("quotes", []):
                          if q.get("symbol"):
                              return q["symbol"]
                  except Exception:
                      pass
              return None
          
          
          def from_yahoo(ident):
              sym = yahoo_symbol(ident)
              if not sym:
                  raise ValueError("not found")
              last = None
              for host in ("query1", "query2"):
                  try:
                      j = get("https://%s.finance.yahoo.com/v8/finance/chart/%s?range=10d&interval=1d" % (host, urllib.parse.quote(sym)))
                      res = j["chart"]["result"][0]
                      meta = res.get("meta", {})
                      stamps = res.get("timestamp") or []
                      closes = ((res.get("indicators") or {}).get("quote") or [{}])[0].get("close") or []
                      pts = [(t, c) for t, c in zip(stamps, closes) if c]
                      price = meta.get("regularMarketPrice") or (pts[-1][1] if pts else None)
                      when = meta.get("regularMarketTime") or (pts[-1][0] if pts else None)
                      if not price:
                          raise ValueError("no price")
                      cur = meta.get("currency") or ""
                      if cur == "GBp":
                          cur = "GBX"
                      day = datetime.datetime.fromtimestamp(when, datetime.timezone.utc).strftime("%Y-%m-%d") if when else ""
                      return {"price": round(float(price), 4), "currency": cur, "date": day, "symbol": sym, "name": meta.get("longName") or meta.get("shortName") or "", "source": "Yahoo"}
                  except Exception as e:
                      last = e
              raise last
          
          
          old = {}
          try:
              old = json.load(open("prices.json")).get("prices", {})
          except Exception:
              pass
          out, errors = {}, {}
          for ident in [s.strip().upper() for s in os.environ.get("SYMBOLS", "").split(",") if s.strip()]:
              key = ident.split("=", 1)[0].strip()
              if "=" in ident:
                  order = [("Yahoo", from_yahoo)]
              elif ISIN.match(ident):
                  order = [("FT", from_ft), ("Yahoo", from_yahoo)]
              else:
                  order = [("Stooq", from_stooq), ("Yahoo", from_yahoo)]
              why = []
              for name, fn in order:
                  try:
                      out[key] = fn(ident)
                      break
                  except Exception as e:
                      why.append("%s: %s" % (name, e))
              if key not in out:
                  errors[key] = "; ".join(why) + (" - if you know its Yahoo symbol, write " + key + "=SYMBOL in SYMBOLS" if ISIN.match(ident) else "")
                  if key in old:
                      out[key] = dict(old[key], stale=True)
                  print("FAILED", key, errors[key], file=sys.stderr)
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          json.dump({"updated": stamp, "prices": out, "errors": errors}, open("prices.json", "w"), indent=1)
          print(json.dumps(out)[:900])
          PY
      - name: Save
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Update prices" && git push)
